name: Validate site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Check JavaScript syntax
        run: node --check assets/js/terraz-home.js

      - name: Build Jekyll site
        shell: bash
        run: |
          set -o pipefail
          bundle exec jekyll build --trace 2>&1 | tee jekyll-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-build-log
          path: jekyll-build.log
          if-no-files-found: ignore
          retention-days: 3
