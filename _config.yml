minimal_mistakes_skin: "default"

locale: "ru-RU"
title: "TerraZ"
title_separator: "—"
name: "TerraZ"
description: "Русскоязычный сервер Terraria: гайды, правила, новости, карта и сервисы проекта."
url: "https://test.terraz.ru"
baseurl: ""
repository: "TerraZ-Team/test.terraz.ru"
words_per_minute: 200
enable_copy_code_button: true
copyright: "TerraZ"
copyright_url: "https://terraz.ru"

search: true
search_full_content: true
search_provider: lunr
lunr:
  search_within_pages: true

atom_feed:
  hide: true

social:
  type: "Organization"
  name: "TerraZ"
  links:
    - https://vk.com/terraz
    - https://t.me/terraz_discussion
    - https://terraz.ru/conference

footer:
  links:
    - label: "VK"
      icon: "fab fa-fw fa-vk"
      url: https://vk.com/terraz
    - label: "Telegram"
      icon: "fab fa-fw fa-telegram"
      url: https://t.me/terraz_discussion
    - label: "Discord"
      icon: "fab fa-fw fa-discord"
      url: https://terraz.ru/conference

include:
  - .htaccess
  - _pages

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - minimal-mistakes-jekyll.gemspec
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Europe/Moscow
paginate: 5
paginate_path: /page:num/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: false
      share: false
      related: false
      classes:
        - guide-page
