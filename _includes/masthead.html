{% capture logo_path %}{{ site.logo }}{% endcapture %}

<header class="masthead" role="banner">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Основная навигация">
        <a class="site-title" href="{{ '/' | relative_url }}" aria-label="TerraZ — на главную">
          {% unless logo_path == empty %}
            <img class="site-title__logo" src="{{ logo_path | relative_url }}" alt="">
          {% else %}
            <span class="site-title__mark" aria-hidden="true">T</span>
          {% endunless %}
          <span class="site-title__text">TerraZ</span>
        </a>

        <ul class="visible-links">
          {%- for link in site.data.navigation.main -%}
            <li class="masthead__menu-item">
              <a
                href="{{ link.url | relative_url }}"
                {% if link.description %}title="{{ link.description }}"{% endif %}
                {% if link.target %}target="{{ link.target }}"{% endif %}
                {% if link.target == '_blank' %}rel="noopener noreferrer"{% endif %}
              >{{ link.title }}</a>
            </li>
          {%- endfor -%}
        </ul>

        {% if site.search == true %}
          <button class="search__toggle" type="button" aria-label="Открыть поиск">
            <i class="fas fa-search" aria-hidden="true"></i>
          </button>
        {% endif %}

        <button class="greedy-nav__toggle hidden" type="button" aria-label="Открыть меню">
          <span class="navicon" aria-hidden="true"></span>
        </button>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</header>
