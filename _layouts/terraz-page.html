---
layout: default
---

<main class="tz-page" id="main" role="main">
  <div class="tz-container">
    <header class="tz-page-header">
      {% if page.kicker %}<p class="tz-kicker">{{ page.kicker }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="tz-page-lead">{{ page.description }}</p>{% endif %}
    </header>

    <div class="tz-page-content">
      {{ content }}
    </div>
  </div>
</main>
